<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Upload & Parser</title>
    <link rel="stylesheet" href="uploadCsv.css" />
  </head>
  <body>
    <h1>CSV Upload & Parser</h1>

    <!-- Drop Zone -->
    <div
      id="drop-zone"
      onclick="document.getElementById('file-input').click()"
      ondragover="handleDragOver(event)"
      ondragleave="handleDragLeave(event)"
      ondrop="handleDrop(event)"
    >
      <div class="icon">📄</div>
      <p>Drop your CSV file here</p>
      <span>or click to browse</span>
      <button
        onclick="
          event.stopPropagation();
          document.getElementById('file-input').click();
        "
      >
        ⬆️ Choose file
      </button>
      <input
        type="file"
        id="file-input"
        accept=".csv,text/csv"
        style="display: none"
        onchange="handleFile(this.files[0])"
      />
    </div>

    <!-- Options -->
    <div id="options-bar">
      <div class="option-group">
        <label for="delimiter">Delimiter</label>
        <select id="delimiter" onchange="reparse()">
          <option value=";">Semicolon (;)</option>
          <option value=",">Comma (,)</option>
          <option value="	">Tab</option>
          <option value="|">Pipe (|)</option>
        </select>
      </div>

      <div class="option-group">
        <input type="checkbox" id="has-header" checked onchange="reparse()" />
        <label for="has-header">First row is header</label>
      </div>

      <div class="option-group-right">
        <div class="option-group">
          <label for="preview-rows">Preview rows</label>
          <select id="preview-rows" onchange="renderTable()">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="all">All</option>
          </select>
        </div>
        <button class="danger" onclick="resetAll()">❌ Clear</button>
        <div class="option-group">
          <label for="table-db">Save To</label>
          <select id="table-db">
            <option value="levels">Levels</option>
            <option value="subjects">Subjects</option>
            <option value="achievement">Achievement</option>
            <option value="students">Students</option>
            <option value="teachers">Teachers</option>
            <option value="classes">Classes</option>
            <option value="history_student">History Student</option>
            <option value="assessment">Assessment</option>
            <option value="absence">Absence</option>
          </select>
        </div>
        <button id="btn-upload" onclick="postAsJson()">⬆️Upload</button>
        <!-- <button id="btn-update" onclick="updateBatch()">🔄️Update</button> -->
      </div>
    </div>
    <div id="success-wrapper">
      <p id="success-message"></p>
    </div>

    <!-- Stats -->
    <div id="stats-bar"></div>

    <!-- Error -->
    <div id="error-box"></div>

    <!-- Table -->
    <div id="table-wrap">
      <table id="csv-table"></table>
    </div>

    <div id="truncation-note"></div>

    <script src="uploadCsv.js"></script>
  </body>
</html>
